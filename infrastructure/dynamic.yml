http:
  routers:
    auth-router:
      rule: "PathPrefix(`/api/auth`)"
      service: auth-service
      entryPoints:
        - web
      middlewares:
        - strip-api
        - auth-strip

  middlewares:
    strip-api:
      stripPrefix:
        prefixes:
          - "/api"

    auth-strip:
      stripPrefix:
        prefixes:
          - "/auth"

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth:8080"

  forwardauth-middleware:
    forwardAuth:
      address: "http://auth:8080/validate"
      authResponseHeaders:
        - "X-User-ID"
        - "X-Session-ID"
