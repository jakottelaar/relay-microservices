http:
  routers:
    auth-router:
      rule: "PathPrefix(`/api/auth`)"
      service: auth-service
      entryPoints:
        - web
      middlewares:
        - strip-api
        - auth-strip

    users-router:
      rule: "PathPrefix(`/api/users`)"
      service: users-service
      entryPoints:
        - web
      middlewares:
        - strip-api
        - users-strip
        - forwardauth-middleware

  middlewares:
    strip-api:
      stripPrefix:
        prefixes:
          - "/api"

    auth-strip:
      stripPrefix:
        prefixes:
          - "/auth"

    users-strip:
      stripPrefix:
        prefixes:
          - "/users"

    forwardauth-middleware:
      forwardAuth:
        address: "http://auth:8080/validate"
        authResponseHeaders:
          - "X-User-ID"
          - "X-Session-ID"

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth:8080"
    users-service:
      loadBalancer:
        servers:
          - url: "http://users:8081"
