services:
  postgres:
    image: postgres:18
    container_name: relay-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - relay-network

  traefik:
    image: traefik:latest
    container_name: relay-traefik
    ports:
      - "80:80"
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - relay-network

  auth:
    build: ../services/auth
    container_name: relay-auth
    environment:
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - relay-network

volumes:
  postgres_data:

networks:
  relay-network:
    driver: bridge
